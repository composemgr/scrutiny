# nginx proxy address - http://172.17.0.1:64337

name: scrutiny
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: ghcr.io/analogj/scrutiny:master-omnibus
    container_name: scrutiny-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: scrutiny-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
    cap_add:
      - SYS_RAWIO
      - SYS_ADMIN
    ports:
      - '172.17.0.1:64337:8080'
    volumes:
      - './volumes/config/scrutiny:/opt/scrutiny/config:z'
      - './volumes/data/scrutiny:/opt/scrutiny/influxdb:z'
      - '/run/udev:/run/udev:ro'
    networks:
      - scrutiny

networks:
  scrutiny:
    name: scrutiny
    external: false
