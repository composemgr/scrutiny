
name: scrutiny
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: ghcr.io/analogj/scrutiny:master-omnibus
    container_name: scrutiny-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: scrutiny-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
    cap_add:
      - SYS_RAWIO
      - SYS_ADMIN
    healthcheck:
      test: ['CMD', 'curl', '-s', '-o', '/dev/null', '--max-time', '5', 'http://127.0.0.1:8080/']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - './volumes/config/scrutiny:/opt/scrutiny/config:z'
      - './volumes/data/scrutiny:/opt/scrutiny/influxdb:z'
      - '/run/udev:/run/udev:ro'
    labels:
      - 'cloudflare.enable=true'
      - 'cloudflare.service=http://scrutiny-app:8080'
      - 'cloudflare.hostname=${BASE_HOST_NAME:-$HOSTNAME}'
    networks:
      - scrutiny
      - cloudflare

networks:
  scrutiny:
    name: scrutiny
    external: false
  cloudflare:
    external: true
